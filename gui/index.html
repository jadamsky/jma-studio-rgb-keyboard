<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JMA Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="logo.png" class="brand-logo" alt="JMA Studio">
  </div>
  <div class="topbar-right">
    <span id="hw-status" class="hw-status">
      <span class="hw-dot"></span>
      <span class="hw-label">checking...</span>
    </span>
    <button id="off-btn" class="btn btn-ghost">Off</button>
  </div>
</header>

<main>

  <section class="panel preview-panel">
    <div class="panel-header">
      <h2>Live Preview</h2>
      <span class="panel-sub" id="current-effect-label">--</span>
    </div>
    <div id="keyboard" class="keyboard"></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Presets</h2>
    </div>
    <div id="preset-grid" class="card-grid"></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Quick Effects</h2>
    </div>
    <div id="effect-grid" class="chip-grid"></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Tune &mdash; Gradient</h2>
      <label class="switch-label">
        <input type="checkbox" id="gradient-live" checked>
        <span>Apply live</span>
      </label>
    </div>
    <div class="tune-grid">
      <label class="field">
        <span>Zones</span>
        <select id="g-zone-count">
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>
      <label class="field wide">
        <span>Brightness <em id="g-brightness-val"></em></span>
        <input type="range" id="g-brightness" min="0" max="1" step="0.05" value="0.65">
      </label>
      <div class="subfield-row" id="g-colors-row"></div>
      <div class="subfield-row" id="g-boundaries-row"></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Tune &mdash; Typing Reactive</h2>
      <label class="switch-label">
        <input type="checkbox" id="tr-live" checked>
        <span>Apply live</span>
      </label>
    </div>
    <div class="tune-grid">
      <label class="field wide">
        <input type="checkbox" id="tr-enabled" checked>
        <span>Enable typing-reactive chase</span>
      </label>
      <label class="field">
        <input type="checkbox" id="tr-use-gradient" checked>
        <span>Use Gradient panel as background</span>
      </label>
      <label class="field" id="tr-base-color-field" hidden>
        <span>Base color</span>
        <input type="color" id="tr-base" value="#262626">
      </label>
      <div class="subfield-row" id="tr-reactive-fields">
        <label class="field">
          <span>Bright / bolt color</span>
          <input type="color" id="tr-bright" value="#ffffff">
        </label>
        <label class="field wide">
          <span>Flash decay (s) <em id="tr-decay-val"></em></span>
          <input type="range" id="tr-decay" min="0.1" max="2" step="0.05" value="0.6">
        </label>
        <label class="field">
          <span>Bolt shape</span>
          <select id="tr-shape">
            <option value="rays">Rays (8-point star)</option>
            <option value="radial">Radial (true ring)</option>
          </select>
        </label>
        <label class="field">
          <span>Bolt style</span>
          <select id="tr-style">
            <option value="solid">Solid</option>
            <option value="rainbow">Rainbow puke</option>
          </select>
        </label>
        <label class="field wide">
          <span>Bolt speed <em id="tr-speed-val"></em></span>
          <input type="range" id="tr-speed" min="2" max="30" step="1" value="12">
        </label>
        <label class="field wide">
          <span>Bolt tail length <em id="tr-tail-val"></em></span>
          <input type="range" id="tr-tail" min="0.5" max="10" step="0.5" value="3">
        </label>
        <label class="field wide" id="tr-flicker-field" hidden>
          <span>Rainbow flicker speed <em id="tr-flicker-val"></em></span>
          <input type="range" id="tr-flicker" min="1" max="20" step="1" value="6">
        </label>
      </div>
    </div>
  </section>

</main>

<footer class="actionbar">
  <button id="save-preset-btn" class="btn btn-accent">Save current as preset</button>
  <button id="set-default-btn" class="btn btn-ghost">Set as startup default</button>
  <span id="toast" class="toast"></span>
</footer>

<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div class="modal">
    <h3>Save preset</h3>
    <input type="text" id="modal-name" placeholder="e.g. sunset_chase" autocomplete="off">
    <div class="modal-actions">
      <button id="modal-cancel" class="btn btn-ghost">Cancel</button>
      <button id="modal-confirm" class="btn btn-accent">Save</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
